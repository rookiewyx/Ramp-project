[project]
name = "ramp-agent"
version = "0.1.0"
description = "企业报销审核 Agent：票据识别、查重、制度审核与渐进式自动审批（对标 Ramp Policy Agent）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Web 服务
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    # 存储：MySQL + Redis
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "alembic>=1.13",
    "redis>=5.0",
    # 大模型调用（OpenAI 兼容接口：Qwen / DeepSeek / AutoDL 上的 vLLM）
    "openai>=1.40",
    "httpx>=0.27",
    "tenacity>=8.3",
    # 票据处理
    "pymupdf>=1.24",
    "pillow>=10.3",
    # 可观测性（OTel GenAI 语义约定）
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    # 配置与日志
    "pyyaml>=6.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
data = [
    "huggingface_hub>=0.24",
    "pyarrow>=16.0",
    "reportlab>=4.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "locust>=2.29",
]

[project.scripts]
evalhub = "ramp_agent.evalhub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramp_agent"]

[tool.ruff]
line-length = 100
extend-exclude = ["data"]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
